# Fork-only evidence run for #1876 (not part of the PR): the classifier tests on the PR head
# (green), then the new tests on the PR's first commit, which adds them without the fix (red).
name: ci-1876 classifier evidence
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"
      CORBANU_TEST_NO_NATIVE_KEYRING: "1"
      RUST_BACKTRACE: "1"
      RUST_MIN_STACK: "8388608"
      CARGO_TARGET_DIR: /mnt/cargo-target
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Commits under test
        run: |
          git log --oneline -3
          echo "PR_HEAD=$(git rev-parse HEAD~1)" >> "$GITHUB_ENV"
          echo "TESTS_COMMIT=$(git rev-parse HEAD~2)" >> "$GITHUB_ENV"
      - name: Disk
        working-directory: .
        run: |
          sudo mkdir -p /mnt/cargo-target && sudo chown "$USER" /mnt/cargo-target
          df -h / /mnt
      - name: Install Linux build dependencies
        working-directory: .
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev bubblewrap
      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy, rustfmt
      - name: cargo fmt --check
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: blob size policy (changed files)
        working-directory: .
        run: |
          git diff --name-only "$TESTS_COMMIT~1" "$PR_HEAD" | while read -r f; do
            printf '%8d %s\n' "$(git cat-file -s "$PR_HEAD:$f")" "$f"
          done
          python3 scripts/check_blob_size.py --help | head -20 || true
      - name: Build the codex-core test binary (PR head)
        run: cargo test --locked -p codex-core --lib --no-run
      - name: "GREEN: cargo test -p codex-core --lib -- tainted_action_git_ext_tests"
        run: cargo test --locked -p codex-core --lib -- tainted_action_git_ext_tests
      - name: "GREEN: cargo test -p codex-core --lib -- security::tainted_action"
        run: cargo test --locked -p codex-core --lib -- security::tainted_action
      - name: "GREEN: cargo test -p codex-core --lib -- security:: (as rust-ci-core-security)"
        run: "cargo test --locked -p codex-core --lib -- security::"
      - name: "cargo clippy -p codex-core --tests -- -D warnings"
        run: cargo clippy --locked -p codex-core --tests -- -D warnings
      - name: "RED: the new tests on the tests commit (no fix)"
        continue-on-error: true
        run: |
          git checkout "$TESTS_COMMIT" -- core
          git log --oneline -1 "$TESTS_COMMIT"
          cargo test --locked -p codex-core --lib -- tainted_action_git_ext_tests
